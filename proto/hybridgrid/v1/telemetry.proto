syntax = "proto3";

package hybridgrid.v1;

option go_package = "github.com/h3nr1-d14z/hybridgrid/gen/go/hybridgrid/v1;hybridgridv1";

// ============================================================
// Telemetry: read-only observation plane
// ============================================================
//
// The Telemetry service exposes the coordinator's aggregate state
// (cluster stats, workers, tasks, builds, retained console output)
// and a live event stream to out-of-process consumers. It is the
// contract the standalone dashboard binary (hg-dashboard) — and any
// third-party UI in any stack — is built against; the coordinator
// itself no longer embeds a user interface.
//
// Read-only by design: no RPC here can alter build-plane state.
// Authentication mirrors the build plane: when the coordinator is
// configured with a token, every request must carry it.

// Cluster-wide aggregate statistics. Field-for-field the JSON the
// coordinator's dashboard API has always served.
message TelemetryStats {
  int64 total_tasks = 1;
  int64 success_tasks = 2;
  int64 failed_tasks = 3;
  int64 active_tasks = 4;
  int64 queued_tasks = 5;
  int64 cache_hits = 6;
  int64 cache_misses = 7;
  double cache_hit_rate = 8;
  int64 flutter_builds = 9;
  int64 flutter_cache_hits = 10;
  int64 flutter_cache_misses = 11;
  double flutter_cache_hit_rate = 12;
  int64 unity_builds = 13;
  int64 unity_cache_hits = 14;
  int64 unity_cache_misses = 15;
  double unity_cache_hit_rate = 16;
  int32 total_workers = 17;
  int32 healthy_workers = 18;
  int64 uptime_seconds = 19;
  int64 timestamp = 20;
}

// A registered worker as the coordinator sees it.
message TelemetryWorker {
  string id = 1;
  string host = 2;
  string address = 3;
  string os = 4;
  string architecture = 5;
  repeated string architectures = 6;
  int32 cpu_cores = 7;
  double memory_gb = 8;
  int32 max_parallel_tasks = 9;
  int32 active_tasks = 10;
  int64 total_tasks = 11;
  double success_rate = 12;
  double avg_latency_ms = 13;
  string circuit_state = 14;
  string discovery_source = 15;
  string version = 16;
  bool docker_available = 17;
  bool flutter_available = 18;
  string flutter_sdk_version = 19;
  repeated string flutter_platforms = 20;
  bool unity_available = 21;
  repeated string unity_versions = 22;
  repeated string unity_platforms = 23;
  repeated string compilers = 24;
  repeated string build_types = 25;
  bool healthy = 26;
  int64 last_seen = 27;
}

// A single compilation task. exit_code is omitted on success,
// matching the JSON API's omitempty semantics (absent or zero = ok).
message TelemetryTask {
  string id = 1;
  string build_type = 2;
  string build_id = 3;
  string status = 4;
  string worker_id = 5;
  int64 started_at_ms = 6;
  int64 completed_at_ms = 7;
  int64 duration_ms = 8;
  int64 queue_ms = 9;
  int64 compile_ms = 10;
  int32 exit_code = 11;
  bool from_cache = 12;
  string error_message = 13;
}

// Aggregate view of one logical build over its RETAINED task set.
// truncated marks retention caps; counts are not lifetime counts.
message TelemetryBuild {
  string id = 1;
  string build_type = 2;
  string status = 3;
  int32 total_tasks = 4;
  int32 completed_tasks = 5;
  int32 failed_tasks = 6;
  int32 running_tasks = 7;
  int32 from_cache_count = 8;
  int64 first_task_at_ms = 9;
  int64 last_task_at_ms = 10;
  bool truncated = 11;
}

// Retained console output of one task.
message TelemetryConsole {
  string task_id = 1;
  string stdout = 2;
  string stderr = 3;
  bool truncated = 4;
}

// ============================================================
// Requests / responses
// ============================================================

message GetTelemetryStatsRequest {
  string auth_token = 1;
}

message GetTelemetryStatsResponse {
  TelemetryStats stats = 1;
}

message ListTelemetryWorkersRequest {
  string auth_token = 1;
}

message ListTelemetryWorkersResponse {
  repeated TelemetryWorker workers = 1;
}

message ListTelemetryTasksRequest {
  string auth_token = 1;
  // Bound the response to the newest N tasks; 0 = all retained.
  int32 limit = 2;
}

message ListTelemetryTasksResponse {
  repeated TelemetryTask tasks = 1;
}

message ListTelemetryBuildsRequest {
  string auth_token = 1;
}

message ListTelemetryBuildsResponse {
  repeated TelemetryBuild builds = 1;
}

message GetTelemetryBuildRequest {
  string auth_token = 1;
  string build_id = 2;
}

message GetTelemetryBuildResponse {
  TelemetryBuild build = 1;
  repeated TelemetryTask tasks = 2;
}

message GetTelemetryConsoleRequest {
  string auth_token = 1;
  string task_id = 2;
}

message GetTelemetryConsoleResponse {
  TelemetryConsole console = 1;
}

// One frame of the live event stream. type is one of: stats,
// worker_added, worker_removed, task_started, task_completed, ping.
// payload is the JSON encoding of the same object the WebSocket
// hub broadcasts to browser clients.
message TelemetryEvent {
  string type = 1;
  int64 timestamp = 2;
  string payload_json = 3;
}

message StreamTelemetryEventsRequest {
  string auth_token = 1;
}

// ============================================================
// Service Definition
// ============================================================

service TelemetryService {
  // Cluster statistics snapshot.
  rpc GetStats(GetTelemetryStatsRequest) returns (GetTelemetryStatsResponse);

  // Registered workers.
  rpc ListWorkers(ListTelemetryWorkersRequest) returns (ListTelemetryWorkersResponse);

  // Recent tasks, newest first.
  rpc ListTasks(ListTelemetryTasksRequest) returns (ListTelemetryTasksResponse);

  // Logical build aggregates.
  rpc ListBuilds(ListTelemetryBuildsRequest) returns (ListTelemetryBuildsResponse);

  // One build with its retained tasks. NOT_FOUND when unknown.
  rpc GetBuild(GetTelemetryBuildRequest) returns (GetTelemetryBuildResponse);

  // Retained console output. NOT_FOUND when the task is unknown.
  rpc GetConsole(GetTelemetryConsoleRequest) returns (GetTelemetryConsoleResponse);

  // Live event stream: replays recent events on connect, then
  // pushes new ones until the client disconnects.
  rpc StreamEvents(StreamTelemetryEventsRequest) returns (stream TelemetryEvent);
}

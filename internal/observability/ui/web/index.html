<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hybrid-Grid Control</title>
    <script>
      // Applied before paint to avoid a light/dark flash: mirrors the
      // zustand-persisted value in useSettingsStore (key "hg-settings").
      try {
        var raw = localStorage.getItem('hg-settings')
        var theme = raw ? JSON.parse(raw).state.theme : 'dark'
        document.documentElement.dataset.theme = theme || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

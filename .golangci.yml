version: "2"
run:
  tests: true
linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (*net/http.Server).Shutdown
        - encoding/json.(*Encoder).Encode
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - staticcheck
        path: _test\.go
      # Windows service scaffolding (hg-coord/hg-worker): not yet wired
      # into the CLI, so `unused` flags the whole call chain; event-log
      # writes and SCM disconnects inside it are fire-and-forget.
      # Remove this rule once the service subcommands land.
      - linters:
          - errcheck
          - unused
        path: service_(windows|stub)\.go
      - linters:
          - errcheck
        text: Error return value of `cmd.Help` is not checked
      - linters:
          - errcheck
        text: Error return value of `pem.Encode` is not checked
      - linters:
          - errcheck
        text: Error return value of `.*Execute` is not checked
      - linters:
          - errcheck
        text: Error return value of `k.hasher
      - linters:
          - errcheck
        text: Error return value of `s.Delete` is not checked
      - linters:
          - errcheck
        text: Error return value of `.*Encode` is not checked
      - linters:
          - errcheck
        text: Error return value of `c.conn.Set.*Deadline` is not checked
      - linters:
          - errcheck
        text: Error return value of `c.conn.WriteMessage` is not checked
      - linters:
          - errcheck
        text: Error return value of `w.Write` is not checked
      - linters:
          - errcheck
        text: Error return value of `e.client.Container
      - linters:
          - errcheck
        text: Error return value of `s.registry
      - linters:
          - errcheck
        text: Error return value of `metricsServer.Shutdown` is not checked
      - linters:
          - errcheck
        text: Error return value of `dashSrv.Stop` is not checked
      - linters:
          - ineffassign
        text: ineffectual assignment to err
      - linters:
          - staticcheck
        text: SA4010
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

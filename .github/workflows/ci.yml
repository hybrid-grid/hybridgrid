# Hybrid-Grid Build - CI Pipeline
# Runs on push to main and pull requests

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Track the latest 1.25 patch release. Pinning an exact patch
  # (previously 1.25.8) let the toolchain drift behind security fixes,
  # and govulncheck scans the stdlib of the toolchain in use — three
  # patch releases of stdlib CVEs turned the Security Scan red.
  GO_VERSION: "1.25.13"

jobs:
  # ============================================
  # Build and Test
  # ============================================
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build all binaries
        run: |
          go build -v ./cmd/hg-coord
          go build -v ./cmd/hg-worker
          go build -v ./cmd/hgbuild

      - name: Run tests with race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v ./...

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  # ============================================
  # Code Quality
  # ============================================
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .' to fix."
            gofmt -d .
            exit 1
          fi

      - name: Run golangci-lint
        # Action major must track the golangci-lint major: v4 predates
        # golangci-lint v2 and invokes it with removed v1 flags (exit 3).
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          # G104: Unhandled errors (intentional fire-and-forget)
          # G109/G115: Integer overflow (bounded by protocol, worker counts)
          # G112: Slowloris (internal metrics server)
          # G204: Subprocess with variable input (build system executes compilers)
          # G301/G304/G306: File permissions (build artifacts need read access)
          # G402: TLS InsecureSkipVerify (configurable option)
          args: -exclude=G104,G109,G112,G115,G204,G301,G304,G306,G402 -exclude-dir=gen -exclude-dir=test ./...

      - name: Run govulncheck
        # Fails on any reachable vulnerability except the allowlisted IDs:
        # github.com/docker/docker findings with no fixed release published
        # (checked 2026-07: GO-2026-5746, -5668, -5617, -4887, -4883 all
        # report "Fixed in: N/A"). Re-check periodically and remove IDs
        # from ALLOW as upstream fixes ship.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ALLOW="GO-2026-5746 GO-2026-5668 GO-2026-5617 GO-2026-4887 GO-2026-4883"
          govulncheck -json ./... > vulns.json
          found=$(jq -r 'select(.finding != null) | select(.finding.trace[0].function != null) | .finding.osv' vulns.json | sort -u)
          new=""
          for id in $found; do
            case " $ALLOW " in
              *" $id "*) ;;
              *) new="$new $id" ;;
            esac
          done
          if [ -n "$new" ]; then
            echo "New reachable vulnerabilities not in the allowlist:$new"
            govulncheck ./... || true
            exit 1
          fi
          echo "Reachable findings are all allowlisted (unpatched upstream): $found"

  # ============================================
  # Proto Check (ensure generated code is up-to-date)
  # ============================================
  proto:
    name: Proto Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate proto
        run: |
          protoc --go_out=gen/go --go_opt=paths=source_relative \
                 --go-grpc_out=gen/go --go-grpc_opt=paths=source_relative \
                 -I proto \
                 proto/hybridgrid/v1/build.proto

      - name: Check for changes
        run: |
          # Ignore protoc version comment differences (cosmetic only)
          if git diff --quiet -- ':(exclude)*.pb.go' ':(exclude)*.pb.go'; then
            echo "Proto definitions match (ignoring version comments)"
          elif git diff -- '*.pb.go' | grep -v '^[+-]// 	protoc' | grep -q '^[+-]'; then
            echo "Proto generated code has substantive changes. Run 'make proto' and commit."
            git diff
            exit 1
          else
            echo "Only protoc version comment differences (OK)"
          fi
